services:
  postgres:
    image: postgres:16-alpine
    container_name: spike-b-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spike_b
    ports:
      - "5436:5432"   # Spike A(5435)와 충돌 회피·다른 프로젝트(5433·5434) 회피
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spike_b"]
      interval: 1s
      timeout: 3s
      retries: 30
    command:
      - "postgres"
      - "-c"
      - "log_statement=none"
      - "-c"
      - "max_connections=200"
