version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: spike-d-postgres
    command: postgres -c log_statement=none -c log_min_duration_statement=-1
    ports:
      - "5437:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: "spike_d_dev,spike_d_staging,spike_d_shadow,spike_d_prod"
    volumes:
      - spike-d-data:/var/lib/postgresql/data
      - ./docker/init-multi-db.sh:/docker-entrypoint-initdb.d/01-multi-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spike_d_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  spike-d-data:
